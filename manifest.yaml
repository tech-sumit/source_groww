# =====================
# CONNECTOR SPECIFICATION
# =====================

spec:
  type: Spec
  documentation_url: https://groww.in/trade-api/docs
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    title: Groww Trade API Source Spec
    type: object
    additionalProperties: true
    properties:
      # Authentication - Option 1: Direct Access Token
      access_token:
        type: string
        title: Access Token
        description: "Groww API access token. Either provide this OR use TOTP credentials below."
        airbyte_secret: true
        order: 0

      # Authentication - Option 2: TOTP-based (auto-generates access_token)
      totp_token:
        type: string
        title: TOTP Token
        description: "TOTP Token from Groww API Keys page. Used with totp_secret to auto-generate access_token."
        airbyte_secret: true
        order: 1

      totp_secret:
        type: string
        title: TOTP Secret
        description: "TOTP Secret from Groww API Keys page. Used with totp_token to auto-generate access_token."
        airbyte_secret: true
        order: 2

      # General Settings
      segment:
        type: string
        title: Market Segment
        description: "Market segment to fetch data for (CASH for equities, FNO for derivatives, COMMODITY for commodities)"
        default: "CASH"
        enum:
          - "CASH"
          - "FNO"
          - "COMMODITY"
        order: 1

      # Smart Orders Settings
      smart_order_type:
        type: string
        title: Smart Order Type
        description: "Type of smart orders to fetch"
        default: "GTT"
        enum:
          - "GTT"
          - "OCO"
        order: 2
      
      smart_order_status:
        type: string
        title: Smart Order Status
        description: "Status filter for smart orders"
        default: "ACTIVE"
        enum:
          - "ACTIVE"
          - "CANCELLED"
          - "COMPLETED"
        order: 3

      # Live Quote Settings
      quote_exchange:
        type: string
        title: Quote Exchange
        description: "Exchange for live quote (required for live_quote stream)"
        default: "NSE"
        enum:
          - "NSE"
          - "BSE"
          - "MCX"
        order: 4

      quote_trading_symbol:
        type: string
        title: Quote Trading Symbol
        description: "Trading symbol for live quote (e.g., NIFTY, RELIANCE). Required for live_quote stream."
        examples:
          - "NIFTY"
          - "RELIANCE"
          - "BANKNIFTY"
        order: 5

      # Historical Data Settings
      historical_exchange:
        type: string
        title: Historical Data Exchange
        description: "Exchange for historical data"
        default: "NSE"
        enum:
          - "NSE"
          - "BSE"
          - "MCX"
        order: 6

      historical_groww_symbol:
        type: string
        title: Historical Groww Symbol
        description: "Groww symbol for historical data (e.g., NSE-WIPRO, NSE-NIFTY-30Sep25-24650-CE)"
        examples:
          - "NSE-WIPRO"
          - "NSE-NIFTY"
          - "NSE-NIFTY-30Sep25-FUT"
        order: 7

      historical_start_time:
        type: string
        title: Historical Start Time
        description: "Start time for historical data in 'YYYY-MM-DD HH:mm:ss' format"
        examples:
          - "2024-01-01 09:15:00"
        order: 8

      historical_end_time:
        type: string
        title: Historical End Time
        description: "End time for historical data in 'YYYY-MM-DD HH:mm:ss' format"
        examples:
          - "2024-12-31 15:30:00"
        order: 9

      candle_interval:
        type: string
        title: Candle Interval
        description: "Candle interval for historical data"
        default: "1day"
        enum:
          - "1minute"
          - "2minute"
          - "3minute"
          - "5minute"
          - "10minute"
          - "15minute"
          - "30minute"
          - "1hour"
          - "4hour"
          - "1day"
          - "1week"
          - "1month"
        order: 10

      # Expiries Settings
      expiry_exchange:
        type: string
        title: Expiry Exchange
        description: "Exchange for expiry dates lookup"
        default: "NSE"
        enum:
          - "NSE"
          - "BSE"
        order: 11

      expiry_underlying_symbol:
        type: string
        title: Expiry Underlying Symbol
        description: "Underlying symbol for expiry dates (e.g., NIFTY, BANKNIFTY)"
        examples:
          - "NIFTY"
          - "BANKNIFTY"
          - "RELIANCE"
        order: 12

      expiry_year:
        type: integer
        title: Expiry Year
        description: "Year for expiry dates lookup (2020 onwards). Leave empty for current year."
        minimum: 2020
        order: 13

      expiry_month:
        type: integer
        title: Expiry Month
        description: "Month for expiry dates lookup (1-12). Leave empty for full year."
        minimum: 1
        maximum: 12
        order: 14

      # Contracts Settings
      contract_exchange:
        type: string
        title: Contract Exchange
        description: "Exchange for contracts lookup"
        default: "NSE"
        enum:
          - "NSE"
          - "BSE"
        order: 15

      contract_underlying_symbol:
        type: string
        title: Contract Underlying Symbol
        description: "Underlying symbol for contracts lookup"
        examples:
          - "NIFTY"
          - "BANKNIFTY"
        order: 16

      contract_expiry_date:
        type: string
        title: Contract Expiry Date
        description: "Expiry date for contracts in YYYY-MM-DD format"
        examples:
          - "2025-01-30"
        order: 17

      # Option Chain Settings
      option_chain_exchange:
        type: string
        title: Option Chain Exchange
        description: "Exchange for option chain data"
        default: "NSE"
        enum:
          - "NSE"
          - "BSE"
        order: 18

      option_chain_underlying:
        type: string
        title: Option Chain Underlying
        description: "Underlying symbol for option chain (e.g., NIFTY, BANKNIFTY)"
        examples:
          - "NIFTY"
          - "BANKNIFTY"
        order: 19

      option_chain_expiry_date:
        type: string
        title: Option Chain Expiry Date
        description: "Expiry date for option chain in YYYY-MM-DD format"
        examples:
          - "2025-01-30"
        order: 20
